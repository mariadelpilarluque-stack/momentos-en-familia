<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6B45">
<title>Momentos en Familia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="App gratuita para que padres y madres de Tingo María pongan límites al trabajo y compartan más momentos en familia.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Momentos">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --selva:#1E6B45; --selva-osc:#14492F; --hoja:#3FA66B; --menta:#E4F3E8; --menta-2:#CFE9D7;
  --crema:#FAF7F0; --sol:#F2B632; --sol-claro:#FDF0CC; --tierra:#C8643F; --tierra-txt:#A44E2D;
  --rio:#5FB3CF; --tinta:#1C2A21; --gris:#56665B; --linea:#DCE5DD; --blanco:#FFFFFF;
  --sombra:0 2px 12px rgba(20,73,47,.08); --radio:20px;
  --titulo:'Poppins','Inter',system-ui,sans-serif; --texto:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#DDE7DF;color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.45}
.app{position:relative;max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--crema);overflow-x:hidden}
main{padding:20px 18px 120px;display:flex;flex-direction:column;gap:16px}
main.sin-nav{padding-bottom:32px}
h1,h2,h3{font-family:var(--titulo);font-weight:600;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.sub{color:var(--gris);font-size:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--selva)}
.card{background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.plana{box-shadow:none;border:1px solid var(--linea)}
.fila{display:flex;align-items:center;gap:10px}
.entre{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button,.btn{font-family:var(--titulo);font-weight:500;font-size:16px;border:0;cursor:pointer;border-radius:14px;min-height:52px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .1s,background .2s}
button:active,.btn:active{transform:scale(.98)}
.btn{background:var(--selva);color:#fff;width:100%}
.btn.sec{background:var(--menta);color:var(--selva-osc)}
.btn.sol{background:var(--sol);color:var(--tinta)}
.btn.borde{background:transparent;color:var(--selva);border:1.5px solid var(--selva)}
.btn.blanco{background:rgba(255,255,255,.16);color:#fff;min-height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn.chico{min-height:46px;font-size:15px;padding:0 12px;white-space:nowrap}
.link{background:none;color:var(--selva);min-height:44px;padding:0 4px;font-size:15px;width:auto}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
.icono{width:22px;height:22px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{font-family:var(--texto);font-weight:500;font-size:14px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--blanco);color:var(--tinta);border:1.5px solid var(--linea);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--selva);border-color:var(--selva);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--menta);color:var(--selva-osc)}
.badge.sol{background:var(--sol-claro);color:#6B4E00}
.badge.tierra{background:#F7E1D7;color:var(--tierra-txt)}
label{font-size:14px;font-weight:500;color:var(--tinta);display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=number],input[type=time],select,textarea{font-family:var(--texto);font-size:16px;color:var(--tinta);background:var(--blanco);border:1.5px solid var(--linea);border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--selva);outline:none}
.check{flex-direction:row;align-items:flex-start;gap:12px;font-weight:400}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--selva);flex:none}
/* Ilustraciones */
.ilus{display:block;width:100%;height:auto;border-radius:16px}
/* Barra de navegación */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--blanco);border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;flex-direction:column;gap:2px;font-family:var(--texto);font-size:11.5px;font-weight:500;color:var(--gris);min-height:56px;padding:0;border-radius:12px}
nav button[aria-current=page]{color:var(--selva)}
nav button[aria-current=page] .icono{stroke-width:2.4}
nav .centro{position:relative}
nav .centro span.bola{width:58px;height:58px;border-radius:50%;background:var(--selva);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 16px rgba(30,107,69,.35);border:4px solid var(--crema)}
nav .centro[aria-current=page] span.bola{background:var(--sol);color:var(--tinta)}
/* Hoy */
.hero{background:linear-gradient(135deg,var(--selva) 0%,#2C8556 100%);color:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .hoja-fondo{position:absolute;right:-30px;bottom:-40px;width:180px;opacity:.12}
.hero .grande{font-family:var(--titulo);font-size:34px;font-weight:600;line-height:1}
.anillo{width:96px;height:96px;flex:none}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--menta);color:var(--selva);display:flex;align-items:center;justify-content:center;font-family:var(--titulo);font-weight:600}
.mini{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:18px;background:var(--blanco);box-shadow:var(--sombra);text-align:left;min-height:auto;font-family:var(--texto);font-weight:400;color:var(--tinta);align-items:flex-start}
.mini .num{font-family:var(--titulo);font-size:24px;font-weight:600;color:var(--selva)}
.tip{background:var(--sol-claro);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
/* Actividades */
.tarjeta{background:var(--blanco);border-radius:18px;box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-height:auto;font-family:var(--texto);font-weight:400;color:var(--tinta);align-items:stretch}
.tarjeta .ilus{border-radius:0}
.tarjeta .cuerpo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.tarjeta h3{font-size:14.5px;line-height:1.25}
.buscar{position:relative}
.buscar input{padding-left:44px;border-radius:14px}
.buscar .icono{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gris)}
/* Detalle */
.cabecera-ilus{position:relative;margin:-20px -18px 0}
.cabecera-ilus .ilus{border-radius:0 0 28px 28px}
.volver{position:absolute;left:14px;top:14px;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:rgba(255,255,255,.92);color:var(--tinta);box-shadow:var(--sombra)}
.pasos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:p}
.pasos li{display:flex;gap:12px;align-items:flex-start;counter-increment:p}
.pasos li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--menta);color:var(--selva);font-family:var(--titulo);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.timer{font-family:var(--titulo);font-size:44px;font-weight:600;color:var(--selva);text-align:center;letter-spacing:.02em}
/* Llegué a casa */
.progreso{height:8px;border-radius:999px;background:var(--menta);overflow:hidden}
.progreso>div{height:100%;background:var(--selva);border-radius:999px;transition:width .3s}
.respira{width:200px;height:200px;margin:8px auto;position:relative;display:flex;align-items:center;justify-content:center}
.respira .onda{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--menta-2) 0%,var(--menta) 60%,transparent 70%);transform:scale(.6);transition:transform 4s ease-in-out}
.respira.inhala .onda{transform:scale(1)}
.respira .centro{position:relative;width:110px;height:110px;border-radius:50%;background:var(--selva);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--titulo)}
.respira .centro b{font-size:26px;font-weight:600}
.animo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.animo button{flex-direction:column;background:var(--blanco);border:2px solid var(--linea);min-height:120px;border-radius:18px;font-family:var(--texto);font-size:14px;color:var(--tinta);padding:10px 4px;gap:6px}
.animo button[aria-pressed=true]{border-color:var(--selva);background:var(--menta)}
.lista-check{display:flex;flex-direction:column;gap:2px}
.lista-check label{padding:10px 0;border-bottom:1px solid var(--linea);font-size:15px}
.mensaje{background:var(--menta);border-radius:14px;padding:12px 14px;font-size:14.5px;color:var(--selva-osc)}
/* Semana */
.dia-fila{display:flex;align-items:center;gap:12px;padding:10px;background:var(--blanco);border-radius:16px;box-shadow:var(--sombra);min-height:72px;text-align:left;font-family:var(--texto);font-weight:400;color:var(--tinta);width:100%;justify-content:flex-start}
.dia-fila.hoy{outline:2px solid var(--sol)}
.dia-fila .dnombre{width:44px;text-align:center;font-family:var(--titulo);font-weight:600;color:var(--selva);flex:none}
.dia-fila .thumb{width:72px;flex:none;border-radius:10px;overflow:hidden}
.dia-fila .vacio{flex:1;color:var(--gris);font-size:14px;border:1.5px dashed var(--menta-2);border-radius:12px;padding:12px;text-align:center}
/* Mi árbol */
.semana-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--gris)}
.semana-dias .d{height:38px;border-radius:12px;background:var(--menta);display:flex;align-items:center;justify-content:center;margin-top:4px;color:var(--menta)}
.semana-dias .d.si{background:var(--selva);color:#fff}
.barra{height:10px;border-radius:999px;background:var(--menta);overflow:hidden}
.barra>div{height:100%;background:linear-gradient(90deg,var(--hoja),var(--selva));border-radius:999px}
.logros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.logro{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;color:var(--gris)}
.logro .medalla{width:58px;height:58px;border-radius:50%;background:#EEF1EE;display:flex;align-items:center;justify-content:center;color:#A9B5AC}
.logro.si .medalla{background:var(--sol-claro);color:#B07F00;box-shadow:inset 0 0 0 3px var(--sol)}
.logro.si{color:var(--tinta);font-weight:500}
.estrellas{display:flex;gap:6px;justify-content:center}
.estrellas button{width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;background:var(--menta);color:var(--selva);font-size:18px}
.estrellas button[aria-pressed=true]{background:var(--sol);color:var(--tinta)}
/* Hoja inferior y avisos */
.velo{position:fixed;inset:0;background:rgba(20,40,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:aparece .2s}
.hoja-inf{background:var(--crema);width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:sube .25s}
.asa{width:40px;height:5px;border-radius:999px;background:var(--linea);margin:0 auto 4px}
.interruptor{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;background:var(--blanco);border-radius:14px;padding:12px 14px;font-size:15px}
.interruptor input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--linea);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.interruptor input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.interruptor input:checked{background:var(--selva)}
.interruptor input:checked::after{left:25px}
.aviso{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(10px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;opacity:0;transition:all .25s;pointer-events:none;max-width:380px;width:max-content;z-index:30;text-align:center}
.aviso.ver{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes aparece{from{opacity:0}}
@keyframes sube{from{transform:translateY(40px);opacity:.5}}
.oculto{display:none!important}
/* Bienvenida */
.bienvenida{background:linear-gradient(180deg,var(--menta) 0%,var(--crema) 55%);min-height:100vh;min-height:100dvh;padding:28px 22px 32px;display:flex;flex-direction:column;gap:18px}
.beneficio{display:flex;gap:14px;align-items:center}
.beneficio .circulo{width:44px;height:44px;border-radius:14px;background:var(--blanco);box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;color:var(--selva);flex:none}
.marca{display:flex;align-items:center;gap:8px;font-family:var(--titulo);font-weight:600;color:var(--selva)}
</style>
</head>
<body>
<div class="app" id="app">
  <main id="pantalla" aria-live="polite"></main>
  <nav id="nav" class="oculto" aria-label="Navegación principal"></nav>
  <div id="aviso" class="aviso" role="status"></div>
</div>
